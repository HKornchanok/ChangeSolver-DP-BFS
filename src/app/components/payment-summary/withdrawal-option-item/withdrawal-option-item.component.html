<div class="flex items-center bg-[var(--black)] rounded-xl">
  <div class="w-1/3 flex justify-center">
    <ng-container [ngSwitch]="coinSize">
      <img
        *ngSwitchCase="11"
        src="assets/coins/COIN-11.svg"
        alt="11 coin"
        class="w-[13vh] h-[6vh]"
      />
      <img *ngSwitchCase="7" src="assets/coins/COIN-7.svg" alt="7 coin" class="w-[13vh] h-[6vh]" />
      <img *ngSwitchCase="5" src="assets/coins/COIN-5.svg" alt="5 coin" class="w-[13vh] h-[6vh]" />
      <img *ngSwitchCase="1" src="assets/coins/COIN-1.svg" alt="1 coin" class="w-[13vh] h-[6vh]" />
    </ng-container>
  </div>
  <div class="w-2/3 flex flex-col items-start">
    <div class="text-white font-bold text-h3 leading-none">฿{{ coinSize }}</div>
    <div class="text-[var(--text-gray)] text-base mt-1 leading-none">
      <span class="text-white text-h4">{{ count }}</span> <span class="text-h4"> Coins</span>
    </div>
  </div>
</div>
